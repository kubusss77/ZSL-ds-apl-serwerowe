<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload zdjęć</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        flex-direction: column;
        gap: 2rem;
        align-items: center;
        height: 100vh;
        background-color: #f4f4f9;
        margin: 0;
      }
      form {
        background: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: 300px;
      }
      div {
        margin-bottom: 1.5rem;
      }
      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: bold;
      }
      input[type='text'],
      input[type='file'] {
        width: 100%;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 0.7rem;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <form action="/api/photos" method="POST" enctype="multipart/form-data">
      <div>
        <label for="name">Nazwa albumu:</label>
        <input type="text" id="name" name="album" placeholder="..." required />
      </div>

      <div>
        <label for="files">Wybierz pliki:</label>
        <input type="file" id="files" name="files" multiple />
      </div>

      <button type="submit">Wyślij dane</button>
    </form>
    <form id="profile-form">
      <div>
        <label for="token">Token:</label>
        <input type="text" id="token" placeholder="..." required />
      </div>

      <div>
        <label for="profile-picture">Wybierz zdjęcie profilowe:</label>
        <input type="file" id="profile-picture" name="files" required />
      </div>

      <button id="send-profile-picture-btn">Wyślij dane</button>
    </form>
  </body>
  <script>
    document.getElementById('send-profile-picture-btn').onclick = sendProfilePicture;

    async function sendProfilePicture(e) {
      e.preventDefault();
      const filesInput = document.getElementById('profile-picture');
      const [file] = filesInput.files;

      const formData = new FormData();
      formData.append('file', file);

      const token = document.getElementById('token').value;
      console.log('token', token);

      try {
        const response = await fetch('http://localhost:3000/api/profile', {
          method: 'POST',
          headers: {
            'Content-Type': 'multipart/form-data',
            Authorization: `Bearer ${token}`,
          },
          body: formData,
        });
        console.log(await response.json());
      } catch (e) {
        console.error(e);
      }
    }
  </script>
</html>
